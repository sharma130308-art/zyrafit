<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1b2f" />
    <title>You're offline — ZyraFit</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: #1a1b2f;
        color: #f5f5f7;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.18), transparent 55%),
          radial-gradient(circle at 80% 100%, rgba(168, 85, 247, 0.18), transparent 55%),
          #1a1b2f;
      }
      .card {
        max-width: 380px;
        width: 100%;
        text-align: center;
        animation: rise 500ms cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .icon-wrap {
        width: 88px;
        height: 88px;
        margin: 0 auto 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      .icon-wrap::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 0.25), transparent 60%);
      }
      .icon-wrap svg {
        width: 44px;
        height: 44px;
        position: relative;
        color: #f5f5f7;
        opacity: 0.95;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 28px;
        color: rgba(245, 245, 247, 0.62);
        font-size: 15px;
        line-height: 1.5;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      button {
        appearance: none;
        border: none;
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        padding: 14px 20px;
        border-radius: 14px;
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.15s ease;
      }
      button:active { opacity: 0.7; transform: scale(0.98); }
      .btn-primary {
        background: #f5f5f7;
        color: #1a1b2f;
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        color: #f5f5f7;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .status {
        margin-top: 24px;
        font-size: 12px;
        color: rgba(245, 245, 247, 0.4);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ef4444;
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6);
        animation: pulse 1.6s infinite;
      }
      .dot.online {
        background: #10b981;
        animation: none;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
        70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
        100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>ZyraFit needs an internet connection to sync your meals. Check your connection and try again.</p>
      <div class="actions">
        <button class="btn-primary" onclick="location.reload()">Try again</button>
        <button class="btn-secondary" onclick="location.href='/'">Go to home</button>
      </div>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="status-text">No connection</span>
      </div>
    </div>
    <script>
      const dot = document.getElementById("dot");
      const text = document.getElementById("status-text");
      function update() {
        if (navigator.onLine) {
          dot.classList.add("online");
          text.textContent = "Back online — reloading…";
          setTimeout(() => location.reload(), 600);
        } else {
          dot.classList.remove("online");
          text.textContent = "No connection";
        }
      }
      window.addEventListener("online", update);
      window.addEventListener("offline", update);
      update();
    </script>
  </body>
</html>
